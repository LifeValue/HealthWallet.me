# Native launch screens for iOS and Android. Generated by
# tool/generate_brand_assets.sh, which first renders the images in
# build/branding/ from branding/app_icon_rounded.png; don't run
# flutter_native_splash on this file by hand.
#
# The image is the app icon (120 logical pixels) with the app name below it,
# centred on the background, the same layout AppLaunchScreen draws in Flutter.
# Android 12+ shows only an icon, so it gets the icon without the name.
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#1E1E1E"
  image: build/branding/splash_light.png
  image_dark: build/branding/splash_dark.png
  fullscreen: true

  android_12:
    image: build/branding/splash_android12.png
    color: "#FFFFFF"
    color_dark: "#1E1E1E"

  web: false
