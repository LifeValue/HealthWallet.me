# Analyzer and formatter settings. Run `scripts/check.sh` before pushing; see AGENTS.md.
include: package:flutter_lints/flutter.yaml

linter:
  # On top of flutter_lints: rules that catch real bugs (unawaited futures, leaked
  # streams) or keep the code uniform. Suppress a single case with `// ignore: <rule>`
  # and a reason, never by disabling the rule here.
  rules:
    - always_declare_return_types
    - avoid_print
    - avoid_returning_null_for_void
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - only_throw_errors
    - prefer_const_constructors
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_super_parameters

analyzer:
  errors:
    invalid_annotation_target: ignore
  exclude:
    - "**/*.freezed.dart"
    - "**/*.g.dart"
    - "**/*.config.dart"
    # Written and deleted by scripts/write_coverage_helper.sh during coverage runs.
    - test/coverage_all_files_test.dart
    - "**/*.gr.dart"
    - "**/*.gen.dart"
    - build/**
    - android/**
    - ios/**
    - windows/**
    - macos/**

formatter:
  page_width: 80
  trailing_commas: preserve
