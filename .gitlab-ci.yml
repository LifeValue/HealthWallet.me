# HealthWallet.me CI/CD. GitLab CI is the only CI; .github/workflows/ is unused.
#
# Checks run in parallel on every branch push and any failure fails the pipeline:
#   checks                  dart format, flutter analyze (infos and   Linux instance runner (Docker)
#                           warnings fatal), flutter test
#   lint                    formatters on the files the branch        Linux instance runner (Docker)
#                           changed
#   lint:commits            commit messages (commitlint); not on      Linux instance runner (Docker)
#                           develop, release/* or master, and no
#                           deploy waits for it
#   scan:dependencies       known vulnerabilities in every lockfile   Linux instance runner (Docker)
#   scan:secrets            secrets anywhere in the git history       Linux instance runner (Docker)
#
# Deploys follow Gitflow and only start once every check has passed:
#   ios / android / macos   manual on develop, release/* and master   shell-macmini (fastlane)
#   macos:direct            manual on develop, release/* and master   shell-macmini (fastlane)
#                           → notarized DMG on the GitLab Release
#   windows                 manual on develop, release/* and master   `windows` runner (ST1, PowerShell)
#                           → the same GitLab Release with zip + msix
#   linux                   manual on develop, release/* and master   Linux instance runner (Docker)
#                           → the same GitLab Release with .deb + tar.gz
#   cdn:publish             manual on develop, release/* and master,  Linux instance runner (Docker)
#                           once windows and linux succeeded
#                           → the release's zip, .deb, tar.gz and DMG
#                           (if built) on the download CDN: master to
#                           stable/, the others to beta/
#   shorebird patches       manual on master                          shell-macmini
# feature/*, bugfix/* and hotfix/* branches get the checks only.
#
# Deploy jobs need the PROTECTED CI/CD variables, which GitLab only exposes to protected branches;
# on an unprotected branch the job stops at its first step and says so.
#
# Every deploy is started by hand from the pipeline, including on develop: a beta goes to TestFlight
# (iOS, macOS) and the Play internal track only when someone runs it. Nothing goes to production from CI: a tested beta is promoted to the App Store / Play production
# in App Store Connect and Play Console.
#
# The Flutter version comes from .fvmrc, the same pin FVM uses locally.
#
# One-time project setup — the pipeline cannot do these itself:
#   1. Protect `develop`, `master` and `release/*` (Settings → Repository). Protected variables
#      below are only exposed to protected branches. Turn on "Pipelines must succeed"
#      (Settings → Merge requests) so a failing check blocks the merge.
#   2. In mobile/flutter/packages/flutter-airdrop and mobile/health-wallet/fhir-ips-export:
#      Settings → CI/CD → Job token permissions → add mobile/health-wallet/app. The private pub
#      dependencies are fetched with CI_JOB_TOKEN instead of an SSH deploy key.
#   3. CI/CD variables (Settings → CI/CD → Variables), all PROTECTED. Copied from the GitHub
#      Actions secrets under the same names, except where noted:
#        ASC_KEY_ID, ASC_ISSUER_ID                    masked
#        ASC_KEY_CONTENT                              masked — base64 of the .p8, single line
#                                                     (GitHub held the raw .p8 text)
#        MACOS_KEYCHAIN_PASSWORD                      masked — the Mac mini's login keychain
#                                                     (same value ontrainer uses; NOT from GitHub)
#        SHOREBIRD_TOKEN                              masked
#        ENV_FILE_CONTENT                             FILE type — contents of .env
#        APPLE_PASS_CERTIFICATE_BASE64                masked
#        APPLE_PASS_PRIVATE_KEY_BASE64                masked
#        GOOGLE_WALLET_SERVICE_ACCOUNT_BASE64         masked
#        ANDROID_KEYSTORE_BASE64                      masked
#        ANDROID_STORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS   masked
#        PLAY_STORE_SERVICE_ACCOUNT_BASE64            masked
#      The download CDN for cdn:publish (RustFS, S3-compatible; server setup in
#      _bmad-output/planning-artifacts/download-cdn.md), new, not from GitHub:
#        CDN_S3_ENDPOINT                              e.g. https://s3.example.org
#        CDN_S3_REGION                                optional
#        CDN_BUCKET                                   bucket the website downloads from
#        CDN_ACCESS_KEY_ID, CDN_SECRET_ACCESS_KEY     masked — defined twice, one key per channel: the
#                                                     stable/-only key scoped to environment
#                                                     downloads-stable, the beta/-only key to
#                                                     downloads-beta
#        CDN_PUBLIC_URL                               public base URL of the bucket, no trailing /
#   Copied from GitHub but unused (fastlane match was replaced by automatic signing, and the pub
#   dependencies come through the job token): MATCH_GIT_URL, MATCH_PASSWORD, SSH_PRIVATE_KEY.
#   Delete them once a TestFlight upload has succeeded without them.
#   4. A "Developer ID Application" certificate for team N668J5X92P, with its private key, in the
#      Mac mini's login keychain: macos:direct signs the DMG with it and stops with instructions
#      when it is missing. Create it in Xcode (Settings → Accounts → Manage Certificates → +) or at
#      developer.apple.com, as the Account Holder, and import the .p12 into the runner user's
#      login keychain.

# Branch pipelines only, no separate merge request pipelines: every push gets one pipeline with the
# manual deploy jobs on it, and an MR shows its source branch's pipeline.
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  interruptible: true

variables:
  GIT_DEPTH: "20"
  # Cache archives are zipped on the runner itself; fastzip with the fastest level keeps the
  # build_runner cache save and the Flutter/pub cache restores quick.
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: "fastest"
  # Scanner images, pinned like every other tool.
  OSV_SCANNER_IMAGE: "ghcr.io/google/osv-scanner:v2.6.0"
  GITLEAKS_IMAGE: "ghcr.io/gitleaks/gitleaks:v8.30.1"
  PRE_COMMIT_VERSION: "4.7.0"
  # JDK for Gradle in the Android jobs (see .android_env).
  ANDROID_JDK_VERSION: "17.0.20.1+1"
  ANDROID_JDK_URL: "https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.20.1%2B1/OpenJDK17U-jdk_aarch64_mac_hotspot_17.0.20.1_1.tar.gz"
  ANDROID_JDK_SHA256: "196d13ba5f10414bef7f6a05a9b3f00edacb18ebacef2b99485db9e2ee18f0e8"

stages:
  - check
  - deploy

# The pubspec pins the private packages to ssh://git@git.lifevalue.com:2822/... URLs. Rewrite
# them to HTTPS with the job token, through environment-scoped git config only: a `git config
# --global` on the shared shell runner would persist into other projects' jobs with a dead token.
.private_deps: &private_deps
  - export GIT_CONFIG_COUNT=1
  - export GIT_CONFIG_KEY_0="url.https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/.insteadOf"
  - export GIT_CONFIG_VALUE_0="ssh://git@${CI_SERVER_HOST}:2822/"

# The Flutter version pinned in .fvmrc (FVM's config), so CI and local builds cannot drift apart.
.flutter_version: &flutter_version
  - export FLUTTER_VERSION="$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)"
  - '[ -n "$FLUTTER_VERSION" ] || { echo "No Flutter version found in .fvmrc"; exit 1; }'

# =============================================================================
# Checks — run in parallel on every branch push; any failure fails the pipeline
# =============================================================================
# Needs no secrets: every Envied field has a default, so codegen runs against an empty .env.
#
# Flutter is installed by the job rather than taken from a prebuilt image: the cirruslabs/flutter
# images stop at 3.44.0. A shallow clone at the release tag is far smaller than the 1.5 GB release
# archive, and the SDK (with the tools it downloads on first run) is cached per .fvmrc.
#
# The Flutter SDK (~21k files) and the pub cache (~49k files) are saved only by `cache:flutter`,
# which runs only when .fvmrc or pubspec.lock changes (and on a branch's first pipeline).
# `checks` just restores them: re-zipping both after every run took over 10 minutes.
.flutter_job:
  image: buildpack-deps:bookworm
  variables:
    PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
    FLUTTER_HOME: "$CI_PROJECT_DIR/.flutter-sdk"
  before_script:
    - *flutter_version
    - |
      if [ ! -x "$FLUTTER_HOME/bin/flutter" ]; then
        rm -rf "$FLUTTER_HOME"
        git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$FLUTTER_HOME"
      fi
    - git config --global --add safe.directory "$FLUTTER_HOME"
    - export PATH="$FLUTTER_HOME/bin:$PATH"
    - flutter --version
    - *private_deps
    # Declared asset directories that only hold secrets in release builds.
    - mkdir -p assets/certs/android
    - touch .env
    - flutter pub get --enforce-lockfile

.flutter_sdk_cache: &flutter_sdk_cache
  key:
    files: [.fvmrc]
    prefix: flutter-sdk
  paths:
    - .flutter-sdk

.pub_cache: &pub_cache
  key:
    files: [pubspec.lock]
    prefix: pub
  paths:
    - .pub-cache

# Fills the Flutter SDK and pub caches for `checks`, including the Linux host tools that
# flutter test uses. If the runner's caches were cleared, run a pipeline with
# REFRESH_FLUTTER_CACHE=true (CI/CD → Run pipeline) to fill them again.
cache:flutter:
  stage: .pre
  extends: .flutter_job
  rules:
    - if: $REFRESH_FLUTTER_CACHE == "true"
    - changes: [.fvmrc, pubspec.lock]
  cache:
    - <<: *flutter_sdk_cache
      policy: pull-push
    - <<: *pub_cache
      policy: pull-push
  script:
    - flutter precache --linux --no-android --no-ios

# Kept fast: buildpack-deps already has git, curl, unzip and xz (no apt-get per run), the SDK and
# pub caches are only restored, build_runner reuses its cached state so it only rebuilds what
# changed, and analyze and test run in parallel.
checks:
  stage: check
  extends: .flutter_job
  needs:
    - job: cache:flutter
      optional: true
  cache:
    - <<: *flutter_sdk_cache
      policy: pull
    - <<: *pub_cache
      policy: pull
    # build_runner's asset graph and the files it generated (all gitignored); small, so saved
    # after every run.
    - key: build-runner-$CI_COMMIT_REF_SLUG
      fallback_keys:
        - build-runner-develop
        - build-runner-master
      paths:
        - .dart_tool/build/
        - lib/**/*.g.dart
        - lib/**/*.freezed.dart
        - lib/**/*.gr.dart
        - lib/**/*.config.dart
  before_script:
    - !reference [.flutter_job, before_script]
    # Incremental thanks to the cache; a stale cached output is replaced, never a failure.
    - dart run build_runner build --delete-conflicting-outputs
  script:
    # Same exclusions as .pre-commit-config.yaml: generated files are never formatted.
    - git ls-files '*.dart' | grep -vE '\.(g|freezed|gr|config|gen)\.dart$|/app_localizations[^/]*\.dart$|^test/drift/my_database/generated/' | xargs dart format --output=none --set-exit-if-changed
    # Analyze (errors, warnings and infos all fail, as in scripts/check.sh) and test run in
    # parallel; the job fails if either fails. The tests run with coverage, and a critical area
    # below its floor in tool/coverage_floors.json fails the job too (see tool/coverage_report.dart).
    # The coverage helper is written after analyze has started reading the files, and analyze
    # ignores it anyway (analysis_options.yaml).
    - |
      flutter analyze --no-pub > analyze.log 2>&1 &
      analyze_pid=$!
      scripts/write_coverage_helper.sh
      test_status=0
      flutter test --no-pub --coverage || test_status=$?
      rm -f test/coverage_all_files_test.dart
      coverage_status=0
      if [ "$test_status" -eq 0 ]; then
        dart run tool/coverage_report.dart --check || coverage_status=$?
      fi
      analyze_status=0
      wait "$analyze_pid" || analyze_status=$?
      echo "==> flutter analyze"
      cat analyze.log
      [ "$analyze_status" -eq 0 ] && [ "$test_status" -eq 0 ] && [ "$coverage_status" -eq 0 ]

# BASE = where this branch left its Gitflow parent (develop, or master for hotfix/*); on develop
# and master, the previous push. Only that parent is fetched, only as deep as needed, instead of the
# whole 150 MB history. Used by `lint` and `scan:secrets` to check just this branch's changes.
.diff_base: &diff_base
  - git config --global --add safe.directory "$CI_PROJECT_DIR"
  - |
    TARGET=""
    case "$CI_COMMIT_BRANCH" in
      develop|master) BASE="$CI_COMMIT_BEFORE_SHA" ;;
      hotfix/*) TARGET=master ;;
      *) TARGET=develop ;;
    esac
    if [ -n "$TARGET" ]; then
      # Explicit refspecs: CI clones one branch, so a plain `git fetch origin develop` would not
      # create origin/develop.
      git fetch -q --depth=100 origin "+refs/heads/$TARGET:refs/remotes/origin/$TARGET"
      tries=0
      until BASE="$(git merge-base "origin/$TARGET" HEAD 2>/dev/null)"; do
        tries=$((tries + 1))
        if [ "$tries" -gt 10 ]; then echo "No common history with $TARGET"; exit 1; fi
        git fetch -q --deepen=200 origin "+refs/heads/$TARGET:refs/remotes/origin/$TARGET" \
          "+refs/heads/$CI_COMMIT_BRANCH:refs/remotes/origin/$CI_COMMIT_BRANCH"
      done
    fi
    if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then BASE="$(git rev-parse HEAD~1)"; fi
    echo "Checking changes since $BASE"

# Every other formatter (.pre-commit-config.yaml) on the files this branch changed. Dart is
# formatted in `checks`; swift-format needs Xcode, so Swift is only formatted by the local hook.
# Commit messages are checked in `lint:commits`.
#
# Kept fast: a hook whose file types the branch did not touch is skipped, so its tool is never
# installed (Java and Ruby too); the image already has git, curl and xz; Node is a pinned,
# checksum-verified 31 MB download; only the small pip and npm download caches are kept.
# Python 3.13 image: gersemi's native module needs a Python below 3.15 (see .pre-commit-config.yaml).
lint:
  stage: check
  image: python:3.13-bookworm
  variables:
    NODE_VERSION: "22.23.3"
    NODE_SHA256_X64: "df450af89261115ef9f9e3830c3eeb2cc9213b63c720b1af623cb5dcbe2e02de"
    NODE_SHA256_ARM64: "a44aeb94849a299b22df10b9e622ec2f605c2183501bc40590705131de7c740f"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
  cache:
    - key:
        files: [.pre-commit-config.yaml, package-lock.json]
        prefix: lint-downloads
      paths:
        - .cache/pip/
        - .cache/npm/
  before_script:
    - *diff_base
    - CHANGED="$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD)"
    - |
      SKIP="dart-format,swift-format"
      needs() { echo "$CHANGED" | grep -qE "$1"; }
      needs '\.(kt|kts)$' || SKIP="$SKIP,pretty-format-kotlin"
      needs '(^|/)(Gemfile|Podfile|Fastfile|Appfile)$|\.rb$' || SKIP="$SKIP,rubocop"
      needs '\.(c|cc|cpp|h|hpp)$' || SKIP="$SKIP,clang-format"
      needs '(^|/)CMakeLists\.txt$|\.cmake$' || SKIP="$SKIP,gersemi"
      needs '\.(sh|bash)$|^scripts/' || SKIP="$SKIP,shfmt,shellcheck"
      export SKIP
      echo "Skipping hooks with nothing to check: $SKIP"
    - |
      if ! echo "$SKIP" | grep -q pretty-format-kotlin || ! echo "$SKIP" | grep -q rubocop; then
        apt-get update -qq
        echo "$SKIP" | grep -q pretty-format-kotlin || apt-get install -y -qq --no-install-recommends default-jre-headless > /dev/null
        echo "$SKIP" | grep -q rubocop || apt-get install -y -qq --no-install-recommends ruby ruby-dev > /dev/null
      fi
    - |
      case "$(uname -m)" in
        x86_64) node_arch=x64; node_sha="$NODE_SHA256_X64" ;;
        aarch64) node_arch=arm64; node_sha="$NODE_SHA256_ARM64" ;;
        *) echo "Unsupported runner architecture $(uname -m)"; exit 1 ;;
      esac
      curl -fsSL --retry 3 -o /tmp/node.tar.xz "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-$node_arch.tar.xz"
      echo "$node_sha  /tmp/node.tar.xz" | sha256sum -c - > /dev/null
      mkdir -p /opt/node && tar -xJf /tmp/node.tar.xz -C /opt/node --strip-components 1
      export PATH="/opt/node/bin:$PATH"
    - pip install -q "pre-commit==$PRE_COMMIT_VERSION"
    - npm ci --ignore-scripts --no-audit --no-fund
  script:
    - pre-commit run --show-diff-on-failure --from-ref "$BASE" --to-ref HEAD

# Commit messages against Conventional Commits (commitlint.config.mjs), checked where they can
# still be amended: on the working branches. Commits that reached develop, release/* or master are
# shared history, and rewording them would mean a force-push, so those branches skip this job and
# no deploy waits for it (it is not in `all_checks`).
lint:commits:
  stage: check
  image: node:22.23.3-bookworm
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
  cache:
    - key:
        files: [package-lock.json]
        prefix: commitlint-downloads
      paths:
        - .cache/npm/
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH =~ /^release\//
      when: never
    - if: $CI_COMMIT_BRANCH
  before_script:
    - *diff_base
    - npm ci --ignore-scripts --no-audit --no-fund
  script:
    - npx --no-install commitlint --from "$BASE" --to HEAD --verbose

# Known vulnerabilities (OSV database) in every lockfile: pub, npm, RubyGems, Swift packages.
scan:dependencies:
  stage: check
  image:
    name: $OSV_SCANNER_IMAGE
    entrypoint: [""]
  script:
    # The image only puts the binary at /osv-scanner (its entrypoint), not on PATH.
    - /osv-scanner scan source --recursive .

# Secrets in the commits this branch adds (the full history was scanned clean when this job was
# introduced); .gitleaks.toml documents the allowlisted false positives.
scan:secrets:
  stage: check
  image:
    name: $GITLEAKS_IMAGE
    entrypoint: [""]
  script:
    - *diff_base
    - gitleaks git --redact --config .gitleaks.toml --verbose --log-opts="$BASE..HEAD" .

# =============================================================================
# Mac mini — iOS, macOS and Android store uploads via fastlane
# =============================================================================
# GitLab's shell executor runs a non-login, non-interactive shell: ~/.zshrc is never read, so
# every tool is put on PATH explicitly. Brew's ruby is keg-only (system ruby is 2.6), FVM's
# Flutter and Shorebird live in the runner user's home.
.macmini_toolchain: &macmini_toolchain
  - export PATH="/opt/homebrew/opt/ruby/bin:/opt/homebrew/bin:$HOME/.shorebird/bin:$HOME/.pub-cache/bin:$PATH"
  # CocoaPods and fastlane abort on a non-UTF-8 locale.
  - export LC_ALL=en_US.UTF-8 LANG=en_US.UTF-8
  # Gems vendored into the build tree, so another project's `brew upgrade` cannot move fastlane.
  - export BUNDLE_PATH="$CI_PROJECT_DIR/vendor/bundle"
  - |
    missing=""
    for tool in fvm shorebird pod bundle; do
      command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
    done
    if [ -n "$missing" ]; then
      echo "Missing on the Mac mini runner:$missing"
      exit 1
    fi
  - *flutter_version
  - fvm install "$FLUTTER_VERSION"
  # The Android Fastfile calls plain `flutter`; make it the pinned version.
  - export PATH="${FVM_CACHE_PATH:-$HOME/fvm}/versions/$FLUTTER_VERSION/bin:$PATH"
  - flutter --version | grep -q "Flutter $FLUTTER_VERSION" || { echo "flutter on PATH is not $FLUTTER_VERSION"; exit 1; }

.restore_app_secrets: &restore_app_secrets
  - cp "$ENV_FILE_CONTENT" .env
  - mkdir -p assets/certs/android
  - printf '%s' "$APPLE_PASS_CERTIFICATE_BASE64" | base64 -d > assets/certs/pass_certificate.pem
  - printf '%s' "$APPLE_PASS_PRIVATE_KEY_BASE64" | base64 -d > assets/certs/private_key.pem

.restore_android_secrets: &restore_android_secrets
  - printf '%s' "$GOOGLE_WALLET_SERVICE_ACCOUNT_BASE64" | base64 -d > assets/certs/android/service-account.json
  - printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
  - |
    cat > android/key.properties <<EOF
    storePassword=$ANDROID_STORE_PASSWORD
    keyPassword=$ANDROID_KEY_PASSWORD
    keyAlias=$ANDROID_KEY_ALIAS
    storeFile=upload-keystore.jks
    EOF

.android_env: &android_env
  - export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}"
  - export ANDROID_SDK_ROOT="$ANDROID_HOME"
  - '[ -d "$ANDROID_HOME" ] || { echo "Android SDK not found at $ANDROID_HOME — set ANDROID_HOME as a CI variable"; exit 1; }'
  # Gradle runs on a pinned Temurin JDK 17 kept in the job cache, not on a JDK of the shared Mac
  # mini. Flutter would pick Android Studio's bundled JBR 17.0.9, which crashes the Gradle daemon on
  # Apple Silicon with recent macOS (JDK-8327860, fixed in 17.0.11). JAVA_HOME alone does not help:
  # Flutter prefers Android Studio's JDK and passes it to Gradle, but org.gradle.java.home wins.
  - |
    jdk_dir="$CI_PROJECT_DIR/.ci-jdk/jdk-$ANDROID_JDK_VERSION"
    if [ ! -x "$jdk_dir/Contents/Home/bin/java" ]; then
      rm -rf "$CI_PROJECT_DIR/.ci-jdk" && mkdir -p "$jdk_dir"
      curl -fsSL --retry 3 -o "$CI_PROJECT_DIR/.ci-jdk/jdk.tar.gz" "$ANDROID_JDK_URL"
      echo "$ANDROID_JDK_SHA256  $CI_PROJECT_DIR/.ci-jdk/jdk.tar.gz" | shasum -a 256 -c -
      tar -xzf "$CI_PROJECT_DIR/.ci-jdk/jdk.tar.gz" -C "$jdk_dir" --strip-components 1
      rm "$CI_PROJECT_DIR/.ci-jdk/jdk.tar.gz"
    fi
    export JAVA_HOME="$jdk_dir/Contents/Home"
    export PATH="$JAVA_HOME/bin:$PATH"
    printf '\norg.gradle.java.home=%s\n' "$JAVA_HOME" >> android/gradle.properties
  - java -version 2>&1 | head -1

# Automatic signing, as ontrainer does on this Mac: the distribution certificates for team
# N668J5X92P are already in the runner's login keychain, and xcodebuild's -allowProvisioningUpdates
# fetches the provisioning profiles with the App Store Connect API key (asc_xcargs in the
# Fastfiles). xcodebuild needs the key as a file, so it is written to the build directory and
# removed in after_script.
.apple_signing: &apple_signing
  # codesign must never block on a keychain prompt — there is no TTY. Both lines are quoted:
  # `codesign: -s` would otherwise parse as a YAML mapping.
  - 'security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$HOME/Library/Keychains/login.keychain-db"'
  - 'security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$HOME/Library/Keychains/login.keychain-db" >/dev/null 2>&1 || true'
  - printf '%s' "$ASC_KEY_CONTENT" | base64 -d > "$CI_PROJECT_DIR/AuthKey.p8"
  - export ASC_KEY_PATH="$CI_PROJECT_DIR/AuthKey.p8"

# Every `pod` call in an iOS or macOS job must use the CocoaPods pinned in ios/Gemfile: the
# runner's Homebrew CocoaPods (1.15) cannot read the Share Extension's synchronized folder groups,
# and both Podfile.locks are written by 1.17. A wrapper first on PATH also covers the implicit
# `pod install` inside `flutter build ios/macos` and `shorebird release/patch`. It sets BUNDLE_* itself because fastlane runs the Flutter build with
# Bundler's environment stripped (Bundler.with_unbundled_env).
.ios_cocoapods: &ios_cocoapods
  - (cd ios && bundle install --jobs 4 --retry 3)
  - mkdir -p "$CI_PROJECT_DIR/.ci-bin"
  - |
    cat > "$CI_PROJECT_DIR/.ci-bin/pod" <<EOF
    #!/bin/sh
    exec env BUNDLE_GEMFILE="$CI_PROJECT_DIR/ios/Gemfile" BUNDLE_PATH="$BUNDLE_PATH" bundle exec pod "\$@"
    EOF
  - chmod +x "$CI_PROJECT_DIR/.ci-bin/pod"
  - export PATH="$CI_PROJECT_DIR/.ci-bin:$PATH"
  - pod --version | grep -q '^1\.17\.' || { echo "pod on PATH is not the CocoaPods pinned in ios/Gemfile"; exit 1; }

# Run from ios/ or macos/. Keeps the committed Podfile.lock, so the pod versions are the reviewed
# ones and CocoaPods only fetches the specs it needs. Retried because the CocoaPods CDN
# intermittently fails with "Error in the HTTP2 framing layer".
.pod_install: &pod_install
  - rm -rf Pods
  - |
    for attempt in 1 2 3; do
      pod install && break
      if [ "$attempt" = 3 ]; then exit 1; fi
      echo "pod install failed (attempt $attempt of 3), retrying in 15s"
      sleep 15
    done

.macmini:
  tags: [shell-macmini]
  # A store upload must not be killed mid-flight by a newer push.
  interruptible: false
  needs: &all_checks ["checks", "lint", "scan:dependencies", "scan:secrets"]
  cache:
    - &bundle_cache
      key: bundle-macos
      paths:
        - vendor/bundle
      # Saved even when the job fails, so a retried deploy doesn't reinstall every gem.
      when: always
  before_script:
    - '[ -n "$ENV_FILE_CONTENT" ] || { echo "Protected CI/CD variables are not available on $CI_COMMIT_BRANCH. Protect this branch (Settings → Repository → Protected branches) to deploy from it."; exit 1; }'
    - *macmini_toolchain
    - *private_deps
    - *restore_app_secrets
    - fvm flutter pub get
    - fvm dart run build_runner build
  # The shell runner's build directory persists between jobs; never leave secrets behind.
  after_script:
    - rm -f .env assets/certs/*.pem assets/certs/android/service-account.json
    - rm -f android/app/upload-keystore.jks android/key.properties android/fastlane/service-account.json
    - rm -f AuthKey.p8

# The integration tests in integration_test/ boot the real mobile app on an iOS simulator. They
# need no secrets (an empty .env, as in `checks`), so they can run on any branch, but they hold
# the shared Mac mini for several minutes: automatic on develop, release/* and master, by hand
# elsewhere. Each run gets a fresh simulator, deleted afterwards, since the tests leave the app in
# Romanian with demo data. extraction_bench/ needs downloaded models and is left to developers.
test:integration:
  stage: check
  tags: [shell-macmini]
  needs: ["checks"]
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH =~ /^release\//
    - when: manual
      allow_failure: true
  cache:
    - *bundle_cache
  before_script:
    - *macmini_toolchain
    - *private_deps
    - touch .env
    - mkdir -p assets/certs/android
    - fvm flutter pub get
    - fvm dart run build_runner build
    - *ios_cocoapods
    - fvm flutter precache --ios
    - cd ios
    - *pod_install
    - cd ..
  script:
    - |
      device_type="$(xcrun simctl list devicetypes | sed -n 's/^iPhone \([0-9][0-9]*\) (\(com[^)]*\))$/\1 \2/p' | sort -n | tail -1 | cut -d' ' -f2)"
      [ -n "$device_type" ] || { echo "No iPhone simulator type on the Mac mini"; exit 1; }
      udid="$(xcrun simctl create "health-wallet-ci-$CI_JOB_ID" "$device_type")"
      xcrun simctl boot "$udid"
      fvm flutter test integration_test/app_l10n_test.dart -d "$udid"
  after_script:
    - xcrun simctl delete "health-wallet-ci-$CI_JOB_ID" || true

# Deploys follow Gitflow: only develop, release/* and master can deploy; feature/*, bugfix/* and
# hotfix/* branches get no deploy jobs. allow_failure: a manual job from `rules:` defaults to
# false, which would leave every pipeline "blocked" until someone ran each deploy. Deploys are
# optional, so the pipeline passes on the checks alone.
.on_deploy_branches: &on_deploy_branches
  - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH =~ /^release\//
    when: manual
    allow_failure: true

.on_master: &on_master
  - if: $CI_COMMIT_BRANCH == "master"
    when: manual
    allow_failure: true

ios:testflight:
  extends: .macmini
  stage: deploy
  rules: *on_deploy_branches
  # One upload per platform at a time: the next build number is read from the store, so two
  # overlapping pipelines would pick the same one.
  resource_group: ios:testflight
  environment: { name: testflight-ios }
  script:
    - *apple_signing
    - *ios_cocoapods
    - fvm flutter precache --ios
    - cd ios
    - *pod_install
    - bundle exec fastlane beta

macos:testflight:
  extends: .macmini
  stage: deploy
  rules: *on_deploy_branches
  # One upload per platform at a time: the next build number is read from the store, so two
  # overlapping pipelines would pick the same one.
  resource_group: macos:testflight
  environment: { name: testflight-macos }
  script:
    - *apple_signing
    - *ios_cocoapods
    - fvm flutter precache --macos
    - cd macos
    - *pod_install
    - bundle install --jobs 4 --retry 3
    - bundle exec fastlane beta

android:play-internal:
  extends: .macmini
  stage: deploy
  rules: *on_deploy_branches
  # One upload per platform at a time: the next build number is read from the store, so two
  # overlapping pipelines would pick the same one.
  resource_group: android:play-internal
  environment: { name: play-internal }
  cache:
    - *bundle_cache
    - key: jdk-temurin-$ANDROID_JDK_VERSION
      paths:
        - .ci-jdk/
      when: always
  script:
    - *android_env
    - *restore_android_secrets
    - printf '%s' "$PLAY_STORE_SERVICE_ACCOUNT_BASE64" | base64 -d > android/fastlane/service-account.json
    - cd android
    - bundle install --jobs 4 --retry 3
    - bundle exec fastlane beta
  artifacts:
    # A crashed Gradle daemon leaves its JVM crash report in android/; the next job's checkout deletes it.
    when: on_failure
    expire_in: 1 week
    paths:
      - android/hs_err_pid*.log

# --- Shorebird over-the-air patches for the latest store release ----------------
shorebird:patch-android:
  extends: .macmini
  stage: deploy
  rules: *on_master
  cache:
    - *bundle_cache
    - key: jdk-temurin-$ANDROID_JDK_VERSION
      paths:
        - .ci-jdk/
      when: always
  script:
    - *android_env
    - *restore_android_secrets
    - shorebird patch --platforms android --release-version=latest --allow-asset-diffs

shorebird:patch-ios:
  extends: .macmini
  stage: deploy
  rules: *on_master
  script:
    - *ios_cocoapods
    - shorebird patch --platforms ios --release-version=latest --no-codesign --allow-asset-diffs

# =============================================================================
# Desktop releases — one GitLab Release per version, which each platform's job adds its files to
# =============================================================================
# master       → release      v<version>
# other branch → pre-release  v<version>-dev.<pipeline iid>
# (scripts/release_tag.sh; windows:release applies the same rule in PowerShell.)
# Each job uploads its packages to the project's generic package registry (healthwallet-macos,
# healthwallet-windows, healthwallet-linux), creates the release for the tag when it does not
# exist yet (on the commit that was built) and links its packages to it, so the macOS, Windows
# and Linux jobs of one pipeline share a release in any order. macOS and Linux do this with
# scripts/gitlab_release.sh, Windows in the job itself.
# cdn:publish then copies the release's packages from the registry to the download CDN.

# macOS outside the App Store: a Developer ID signed, notarized and stapled DMG built by the
# fastlane lane `direct` (macos/fastlane/Fastfile) into build/macos/packages/. Needs the Developer
# ID Application certificate in the runner's keychain (setup step 4 at the top of this file).
macos:direct:
  extends: .macmini
  stage: deploy
  rules: *on_deploy_branches
  script:
    - *apple_signing
    - *ios_cocoapods
    - fvm flutter precache --macos
    # The lane writes exactly one file here; never upload a DMG a previous run left behind.
    - rm -rf build/macos/packages
    - cd macos
    - *pod_install
    - bundle install --jobs 4 --retry 3
    - bundle exec fastlane direct
    - cd ..
    - scripts/gitlab_release.sh healthwallet-macos build/macos/packages

# Windows: portable zip + Store MSIX, built by scripts/build_windows.ps1.
# Runs on the `windows` runner ST1: an x64 Windows machine with a protected project runner (shell
# executor, Windows PowerShell 5.1, builds in C:\gl\builds to keep paths short), started as a
# service under the local, non-admin user ciagent. It only takes jobs from protected branches and
# must be on when the job starts. Installed on it (the script's header lists the same): Git for
# Windows, Visual Studio 2022 Build Tools with the C++ workload and ATL, FVM on the machine PATH
# (it installs the Flutter version from .fvmrc on first use), Developer Mode and long paths. A
# service only sees PATH changes after Windows restarts.
windows:release:
  stage: deploy
  tags: [windows]
  interruptible: false
  needs: *all_checks
  rules: *on_deploy_branches
  # Same rewrite as .private_deps. The braces matter: in "$env:CI_SERVER_HOST:2822" PowerShell reads
  # ":2822" as part of the variable name, which expands to nothing.
  before_script:
    - $env:GIT_CONFIG_COUNT = "1"
    - $env:GIT_CONFIG_KEY_0 = "url.https://gitlab-ci-token:${env:CI_JOB_TOKEN}@${env:CI_SERVER_HOST}/.insteadOf"
    - $env:GIT_CONFIG_VALUE_0 = "ssh://git@${env:CI_SERVER_HOST}:2822/"
  script:
    - if (-not $env:ENV_FILE_CONTENT) { throw "Protected CI/CD variables are not available on $env:CI_COMMIT_BRANCH. Protect this branch to deploy from it." }
    - Copy-Item $env:ENV_FILE_CONTENT .env
    - .\scripts\build_windows.ps1 -Msix
    - $version = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value)
    - if ($env:CI_COMMIT_BRANCH -eq "master") { $tag = "v$version" } else { $tag = "v$version-dev.$env:CI_PIPELINE_IID" }
    - $headers = @{ "JOB-TOKEN" = $env:CI_JOB_TOKEN }
    - $packageUrl = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/healthwallet-windows/$tag"
    - $files = Get-ChildItem build\windows\packages
    - foreach ($file in $files) { Invoke-RestMethod -Method Put -Uri "$packageUrl/$($file.Name)" -Headers $headers -InFile $file.FullName }
    - $releases = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/releases"
    - |
      $release = @{
        tag_name    = $tag
        ref         = $env:CI_COMMIT_SHA
        name        = $tag
        description = "## HealthWallet $tag`n`nBranch: ``$env:CI_COMMIT_BRANCH``, commit: ``$env:CI_COMMIT_SHA```n`n- **macOS (.dmg):** open it and drag HealthWallet to Applications (macOS 14 or newer)`n- **Windows installer (.msix):** double-click to install (Windows 10+)`n- **Windows portable (.zip):** extract and run ``health_wallet.exe```n- **Linux (.deb):** ``sudo apt install ./HealthWallet-Linux-*.deb`` (Ubuntu 24.04, Debian 13 or newer)`n- **Linux portable (.tar.gz):** extract and run ``HealthWallet/health_wallet``"
      } | ConvertTo-Json
      # Sent as UTF-8 bytes: Windows PowerShell 5.1 would otherwise encode a string body as Latin-1.
      # 409 means the other platform's job created the release already; anything else fails the job
      # with GitLab's reason.
      try {
        Invoke-RestMethod -Method Post -Uri $releases -Headers $headers -ContentType "application/json; charset=utf-8" -Body ([System.Text.Encoding]::UTF8.GetBytes($release)) | Out-Null
      } catch {
        $status = [int]$_.Exception.Response.StatusCode
        if ($status -ne 409) { throw "Creating release $tag failed (HTTP $status): $($_.ErrorDetails.Message)" }
      }
    - foreach ($file in $files) { Invoke-RestMethod -Method Post -Uri "$releases/$tag/assets/links" -Headers $headers -Body @{ name = $file.Name; url = "$packageUrl/$($file.Name)"; link_type = "package" } | Out-Null }
  after_script:
    - Remove-Item -Force -ErrorAction SilentlyContinue .env

# Linux: .deb + portable tarball, built by flutter build linux and scripts/package_linux.sh, for
# the runner's architecture. Built on Ubuntu 24.04, the oldest system the packages support:
# llamadart's prebuilt libraries need glibc 2.38.
linux:release:
  stage: deploy
  extends: .flutter_job
  image: ubuntu:24.04
  interruptible: false
  needs: *all_checks
  rules: *on_deploy_branches
  cache:
    - <<: *flutter_sdk_cache
      policy: pull
    - <<: *pub_cache
      policy: pull
  before_script:
    - '[ -n "$ENV_FILE_CONTENT" ] || { echo "Protected CI/CD variables are not available on $CI_COMMIT_BRANCH. Protect this branch (Settings → Repository → Protected branches) to deploy from it."; exit 1; }'
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update -qq
    # Flutter's Linux toolchain, the libraries the runner and the plugins link, and dpkg-deb.
    - >-
      apt-get install -y -qq --no-install-recommends
      ca-certificates git curl unzip xz-utils zip file dpkg-dev
      clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      libsecret-1-dev libayatana-appindicator3-dev libtesseract-dev libleptonica-dev
    - cp "$ENV_FILE_CONTENT" .env
    - !reference [.flutter_job, before_script]
  script:
    - dart run build_runner build --delete-conflicting-outputs
    - flutter build linux --release --target lib/main_desktop.dart
    - scripts/package_linux.sh
    - scripts/gitlab_release.sh healthwallet-linux build/linux/packages
  after_script:
    - rm -f .env

# =============================================================================
# Download CDN — the website's download buttons
# =============================================================================
# Copies one pipeline's desktop packages from the generic package registry to the S3-compatible
# bucket (RustFS) behind the download site, with scripts/publish_cdn.sh: the Windows portable zip,
# the Linux .deb and .tar.gz, and the macOS DMG when macos:direct has already uploaded it for this
# tag (otherwise it is skipped; run cdn:publish again after macos:direct to add it). Files go to
# <channel>/<tag>/ and are never overwritten with other content; <channel>/versions.json, written
# last, tells the website the current version. No Android APK (Google Play) and no MSIX (Store).
# master publishes to stable/, develop and release/* to beta/. Server setup and the versions.json
# contract: _bmad-output/planning-artifacts/download-cdn.md.
#
# It becomes playable once windows:release and linux:release have both succeeded (they in turn
# need every check), and its rules mirror .on_deploy_branches, adding the channel. One publish at
# a time, so two pipelines cannot interleave their versions.json writes.
# Playing cdn:publish on an older pipeline rolls the website back to that version: this is the
# intended rollback path.
cdn:publish:
  stage: deploy
  image:
    name: rclone/rclone:1.75.2
    entrypoint: [""]
  interruptible: false
  needs:
    - job: windows:release
      artifacts: false
    - job: linux:release
      artifacts: false
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual
      allow_failure: true
      variables:
        CDN_CHANNEL: stable
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH =~ /^release\//
      when: manual
      allow_failure: true
      variables:
        CDN_CHANNEL: beta
  resource_group: cdn:publish
  environment:
    name: downloads-$CDN_CHANNEL
  before_script:
    - apk add --no-cache bash curl
  script:
    - scripts/publish_cdn.sh
