# HealthWallet.me CI/CD — replaces the GitHub Actions workflows in .github/workflows/.
#
#   checks                  every branch push                   Linux instance runner (Docker)
#   ios / android / macos   manual on every branch              shell-macmini (fastlane)
#   windows                 manual on every branch              needs a `windows` runner (none yet)
#                           → GitLab Release with zip + msix
#   shorebird patches       manual on master                    shell-macmini
#
# Deploy jobs need the PROTECTED CI/CD variables, which GitLab only exposes to protected branches.
# To deploy from a working branch, protect it (or a wildcard such as `fix/*`) first; otherwise the
# job stops at its first step and says so.
#
# Store uploads are never automatic: the Mac mini is shared with other projects' pipelines, and
# every upload is a deliberate release decision. Each platform is its own manual job, which
# replaces the GitHub "platform" dropdown (android / ios / macos / windows / both / all).
#
# One-time project setup — the pipeline cannot do these itself:
#   1. Protect `develop` and `master` (Settings → Repository), plus any branch you want to deploy
#      from. Protected variables below are only exposed to protected branches.
#   2. In mobile/flutter/packages/flutter-airdrop and mobile/health-wallet/fhir-ips-export:
#      Settings → CI/CD → Job token permissions → add mobile/health-wallet/app. The private pub
#      dependencies are fetched with CI_JOB_TOKEN instead of an SSH deploy key.
#   3. CI/CD variables (Settings → CI/CD → Variables), all PROTECTED. Copied from the GitHub
#      Actions secrets under the same names, except where noted:
#        ASC_KEY_ID, ASC_ISSUER_ID                    masked
#        ASC_KEY_CONTENT                              masked — base64 of the .p8, single line
#                                                     (GitHub held the raw .p8 text)
#        MACOS_KEYCHAIN_PASSWORD                      masked — the Mac mini's login keychain
#                                                     (same value ontrainer uses; NOT from GitHub)
#        SHOREBIRD_TOKEN                              masked
#        ENV_FILE_CONTENT                             FILE type — contents of .env
#        APPLE_PASS_CERTIFICATE_BASE64                masked
#        APPLE_PASS_PRIVATE_KEY_BASE64                masked
#        GOOGLE_WALLET_SERVICE_ACCOUNT_BASE64         masked
#        ANDROID_KEYSTORE_BASE64                      masked
#        ANDROID_STORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS   masked
#        PLAY_STORE_SERVICE_ACCOUNT_BASE64            masked
#      Optional: ANDROID_JAVA_HOME pins the JDK for Gradle on the Mac mini (JDK 17).
#   Copied from GitHub but unused (fastlane match was replaced by automatic signing, and the pub
#   dependencies come through the job token): MATCH_GIT_URL, MATCH_PASSWORD, SSH_PRIVATE_KEY.
#   Delete them once a TestFlight upload has succeeded without them.

# Branch pipelines only, no separate merge request pipelines: every push gets one pipeline with the
# manual deploy jobs on it, and an MR shows its source branch's pipeline.
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  interruptible: true

variables:
  FLUTTER_VERSION: "3.47.7"
  GIT_DEPTH: "20"

stages:
  - check
  - deploy

# The pubspec pins the private packages to ssh://git@git.techstackapps.com:2822/... URLs. Rewrite
# them to HTTPS with the job token, through environment-scoped git config only: a `git config
# --global` on the shared shell runner would persist into other projects' jobs with a dead token.
.private_deps: &private_deps
  - export GIT_CONFIG_COUNT=1
  - export GIT_CONFIG_KEY_0="url.https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/.insteadOf"
  - export GIT_CONFIG_VALUE_0="ssh://git@${CI_SERVER_HOST}:2822/"

# =============================================================================
# Checks — analyze + tests on every branch push
# =============================================================================
# Needs no secrets: every Envied field has a default, so codegen runs against an empty .env.
#
# Flutter is installed by the job rather than taken from a prebuilt image: the cirruslabs/flutter
# images stop at 3.44.0. A shallow clone at the release tag is far smaller than the 1.5 GB release
# archive, and the SDK (with the tools it downloads on first run) is cached per Flutter version.
checks:
  stage: check
  image: debian:bookworm-slim
  variables:
    PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
    FLUTTER_HOME: "$CI_PROJECT_DIR/.flutter-sdk"
  cache:
    - key: flutter-sdk-$FLUTTER_VERSION
      paths:
        - .flutter-sdk
    - key: pub-$CI_COMMIT_REF_SLUG
      fallback_keys:
        - pub-develop
        - pub-master
      paths:
        - .pub-cache
      when: always
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git curl unzip xz-utils ca-certificates > /dev/null
    - |
      if [ ! -x "$FLUTTER_HOME/bin/flutter" ]; then
        rm -rf "$FLUTTER_HOME"
        git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$FLUTTER_HOME"
      fi
    - git config --global --add safe.directory "$FLUTTER_HOME"
    - export PATH="$FLUTTER_HOME/bin:$PATH"
    - flutter --version
    - *private_deps
    # Declared asset directories that only hold secrets in release builds.
    - mkdir -p assets/certs/android
    - touch .env
    - flutter pub get
    - dart run build_runner build
  script:
    # Errors fail the job; the ~110 existing warnings (mostly unused imports) don't yet.
    # Drop --no-fatal-warnings once they are cleaned up.
    - flutter analyze --no-fatal-infos --no-fatal-warnings
    - flutter test

# =============================================================================
# Mac mini — iOS, macOS and Android store uploads via fastlane
# =============================================================================
# GitLab's shell executor runs a non-login, non-interactive shell: ~/.zshrc is never read, so
# every tool is put on PATH explicitly. Brew's ruby is keg-only (system ruby is 2.6), FVM's
# Flutter and Shorebird live in the runner user's home.
.macmini_toolchain: &macmini_toolchain
  - export PATH="/opt/homebrew/opt/ruby/bin:/opt/homebrew/bin:$HOME/.shorebird/bin:$HOME/.pub-cache/bin:$PATH"
  # CocoaPods and fastlane abort on a non-UTF-8 locale.
  - export LC_ALL=en_US.UTF-8 LANG=en_US.UTF-8
  # Gems vendored into the build tree, so another project's `brew upgrade` cannot move fastlane.
  - export BUNDLE_PATH="$CI_PROJECT_DIR/vendor/bundle"
  - |
    missing=""
    for tool in fvm shorebird pod bundle; do
      command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
    done
    if [ -n "$missing" ]; then
      echo "Missing on the Mac mini runner:$missing"
      exit 1
    fi
  - fvm install "$FLUTTER_VERSION"
  # The Android Fastfile calls plain `flutter`; make it the pinned version.
  - export PATH="${FVM_CACHE_PATH:-$HOME/fvm}/versions/$FLUTTER_VERSION/bin:$PATH"
  - flutter --version | grep -q "Flutter $FLUTTER_VERSION" || { echo "flutter on PATH is not $FLUTTER_VERSION"; exit 1; }

.restore_app_secrets: &restore_app_secrets
  - cp "$ENV_FILE_CONTENT" .env
  - mkdir -p assets/certs/android
  - printf '%s' "$APPLE_PASS_CERTIFICATE_BASE64" | base64 -d > assets/certs/pass_certificate.pem
  - printf '%s' "$APPLE_PASS_PRIVATE_KEY_BASE64" | base64 -d > assets/certs/private_key.pem

.restore_android_secrets: &restore_android_secrets
  - printf '%s' "$GOOGLE_WALLET_SERVICE_ACCOUNT_BASE64" | base64 -d > assets/certs/android/service-account.json
  - printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
  - |
    cat > android/key.properties <<EOF
    storePassword=$ANDROID_STORE_PASSWORD
    keyPassword=$ANDROID_KEY_PASSWORD
    keyAlias=$ANDROID_KEY_ALIAS
    storeFile=upload-keystore.jks
    EOF

.android_env: &android_env
  - export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}"
  - export ANDROID_SDK_ROOT="$ANDROID_HOME"
  - if [ -n "$ANDROID_JAVA_HOME" ]; then export JAVA_HOME="$ANDROID_JAVA_HOME"; export PATH="$JAVA_HOME/bin:$PATH"; fi
  - '[ -d "$ANDROID_HOME" ] || { echo "Android SDK not found at $ANDROID_HOME — set ANDROID_HOME or ANDROID_JAVA_HOME as a CI variable"; exit 1; }'
  # Gradle 9.4 / AGP 9.2 need JDK 17+; the Gradle daemon is the largest process of the build.
  - java -version 2>&1 | head -1
  - fvm flutter doctor -v 2>/dev/null | grep -iE "Java (binary|version)" || true
  - 'echo "RAM: $(( $(sysctl -n hw.memsize) / 1073741824 )) GB, $(memory_pressure | tail -1)"'

# Automatic signing, as ontrainer does on this Mac: the distribution certificates for team
# N668J5X92P are already in the runner's login keychain, and xcodebuild's -allowProvisioningUpdates
# fetches the provisioning profiles with the App Store Connect API key (asc_xcargs in the
# Fastfiles). xcodebuild needs the key as a file, so it is written to the build directory and
# removed in after_script.
.apple_signing: &apple_signing
  # codesign must never block on a keychain prompt — there is no TTY. Both lines are quoted:
  # `codesign: -s` would otherwise parse as a YAML mapping.
  - 'security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$HOME/Library/Keychains/login.keychain-db"'
  - 'security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$HOME/Library/Keychains/login.keychain-db" >/dev/null 2>&1 || true'
  - printf '%s' "$ASC_KEY_CONTENT" | base64 -d > "$CI_PROJECT_DIR/AuthKey.p8"
  - export ASC_KEY_PATH="$CI_PROJECT_DIR/AuthKey.p8"

# Every `pod` call in an iOS job must use the CocoaPods pinned in ios/Gemfile: the runner's
# Homebrew CocoaPods (1.15) cannot read the Share Extension's synchronized folder groups. A wrapper
# first on PATH also covers the implicit `pod install` inside `flutter build ios` and
# `shorebird release/patch`. It sets BUNDLE_* itself because fastlane runs the Flutter build with
# Bundler's environment stripped (Bundler.with_unbundled_env).
.ios_cocoapods: &ios_cocoapods
  - (cd ios && bundle install --jobs 4 --retry 3)
  - mkdir -p "$CI_PROJECT_DIR/.ci-bin"
  - |
    cat > "$CI_PROJECT_DIR/.ci-bin/pod" <<EOF
    #!/bin/sh
    exec env BUNDLE_GEMFILE="$CI_PROJECT_DIR/ios/Gemfile" BUNDLE_PATH="$BUNDLE_PATH" bundle exec pod "\$@"
    EOF
  - chmod +x "$CI_PROJECT_DIR/.ci-bin/pod"
  - export PATH="$CI_PROJECT_DIR/.ci-bin:$PATH"
  - pod --version | grep -q '^1\.16\.' || { echo "pod on PATH is not the CocoaPods pinned in ios/Gemfile"; exit 1; }

# Run from ios/ or macos/. Keeps the committed Podfile.lock, so the pod versions are the reviewed
# ones and CocoaPods only fetches the specs it needs. Retried because the CocoaPods CDN
# intermittently fails with "Error in the HTTP2 framing layer".
.pod_install: &pod_install
  - rm -rf Pods
  - |
    for attempt in 1 2 3; do
      pod install && break
      if [ "$attempt" = 3 ]; then exit 1; fi
      echo "pod install failed (attempt $attempt of 3), retrying in 15s"
      sleep 15
    done

.macmini:
  tags: [shell-macmini]
  # A store upload must not be killed mid-flight by a newer push.
  interruptible: false
  needs: ["checks"]
  cache:
    - key: bundle-macos
      paths:
        - vendor/bundle
      # Saved even when the job fails, so a retried deploy doesn't reinstall every gem.
      when: always
  before_script:
    - '[ -n "$ENV_FILE_CONTENT" ] || { echo "Protected CI/CD variables are not available on $CI_COMMIT_BRANCH. Protect this branch (Settings → Repository → Protected branches) to deploy from it."; exit 1; }'
    - *macmini_toolchain
    - *private_deps
    - *restore_app_secrets
    - fvm flutter pub get
    - fvm dart run build_runner build
  # The shell runner's build directory persists between jobs; never leave secrets behind.
  after_script:
    - rm -f .env assets/certs/*.pem assets/certs/android/service-account.json
    - rm -f android/app/upload-keystore.jks android/key.properties android/fastlane/service-account.json
    - rm -f AuthKey.p8

# allow_failure: a manual job from `rules:` defaults to false, which would leave every pipeline
# "blocked" until someone ran each deploy. Deploys are optional, so the pipeline passes on checks
# alone.
.on_any_branch: &on_any_branch
  - if: $CI_COMMIT_BRANCH
    when: manual
    allow_failure: true

.on_master: &on_master
  - if: $CI_COMMIT_BRANCH == "master"
    when: manual
    allow_failure: true

ios:testflight:
  extends: .macmini
  stage: deploy
  rules: *on_any_branch
  environment: { name: testflight-ios }
  script:
    - *apple_signing
    - *ios_cocoapods
    - fvm flutter precache --ios
    - cd ios
    - *pod_install
    - bundle exec fastlane beta

macos:testflight:
  extends: .macmini
  stage: deploy
  rules: *on_any_branch
  environment: { name: testflight-macos }
  script:
    - *apple_signing
    - fvm flutter precache --macos
    - cd macos
    - *pod_install
    - bundle install --jobs 4 --retry 3
    - bundle exec fastlane beta

android:play-internal:
  extends: .macmini
  stage: deploy
  rules: *on_any_branch
  environment: { name: play-internal }
  script:
    - *android_env
    - *restore_android_secrets
    - printf '%s' "$PLAY_STORE_SERVICE_ACCOUNT_BASE64" | base64 -d > android/fastlane/service-account.json
    - cd android
    - bundle install --jobs 4 --retry 3
    - bundle exec fastlane beta
  artifacts:
    # A crashed Gradle daemon leaves its JVM crash report in android/; the next job's checkout deletes it.
    when: on_failure
    expire_in: 1 week
    paths:
      - android/hs_err_pid*.log

# --- Shorebird over-the-air patches for the latest store release ----------------
shorebird:patch-android:
  extends: .macmini
  stage: deploy
  rules: *on_master
  script:
    - *android_env
    - *restore_android_secrets
    - shorebird patch --platforms android --release-version=latest --allow-asset-diffs

shorebird:patch-ios:
  extends: .macmini
  stage: deploy
  rules: *on_master
  script:
    - *ios_cocoapods
    - shorebird patch --platforms ios --release-version=latest --no-codesign --allow-asset-diffs

# =============================================================================
# Windows — build zip + MSIX, publish as a GitLab Release
# =============================================================================
# NO WINDOWS RUNNER IS REGISTERED YET. Until one with the `windows` tag exists, triggering this
# job leaves it pending. Expected on that machine: Git for Windows, Flutter $FLUTTER_VERSION on
# PATH, and the shell set to PowerShell (the runner default).
#
# master       → release      v<version>
# other branch → pre-release  v<version>-dev.<pipeline iid>
# The zip and msix go to the project's generic package registry, and the GitLab Release links to
# them. Unlike the GitHub workflow, the release tag is created on the commit that was built, not
# on the default branch.
windows:release:
  stage: deploy
  tags: [windows]
  interruptible: false
  needs: ["checks"]
  rules: *on_any_branch
  before_script:
    - $env:GIT_CONFIG_COUNT = "1"
    - $env:GIT_CONFIG_KEY_0 = "url.https://gitlab-ci-token:$env:CI_JOB_TOKEN@$env:CI_SERVER_HOST/.insteadOf"
    - $env:GIT_CONFIG_VALUE_0 = "ssh://git@$env:CI_SERVER_HOST:2822/"
  script:
    - if (-not $env:ENV_FILE_CONTENT) { throw "Protected CI/CD variables are not available on $env:CI_COMMIT_BRANCH. Protect this branch to deploy from it." }
    - if (-not ((flutter --version) -match "Flutter $env:FLUTTER_VERSION")) { throw "flutter on PATH is not $env:FLUTTER_VERSION" }
    - Copy-Item $env:ENV_FILE_CONTENT .env
    - flutter config --enable-windows-desktop
    - flutter pub get
    - dart run build_runner build
    - flutter build windows --release --target lib/main_desktop.dart
    - $version = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value)
    - if ($env:CI_COMMIT_BRANCH -eq "master") { $tag = "v$version" } else { $tag = "v$version-dev.$env:CI_PIPELINE_IID" }
    - $zip = "HealthWallet-Windows-v$version-portable.zip"
    - $msixOut = "HealthWallet-Windows-v$version-setup.msix"
    - Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath $zip -Force
    - dart run msix:create --version "$version.0"
    - $msix = Get-ChildItem -Path "build\windows\x64\runner\Release" -Filter "*.msix" -Recurse | Select-Object -First 1
    - Copy-Item $msix.FullName $msixOut
    - $headers = @{ "JOB-TOKEN" = $env:CI_JOB_TOKEN }
    - $packageUrl = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/healthwallet-windows/$tag"
    - foreach ($file in @($msixOut, $zip)) { Invoke-RestMethod -Method Put -Uri "$packageUrl/$file" -Headers $headers -InFile $file }
    - |
      $release = @{
        tag_name    = $tag
        ref         = $env:CI_COMMIT_SHA
        name        = $tag
        description = "## HealthWallet $tag (Windows)`n`nBranch: ``$env:CI_COMMIT_BRANCH`` · Commit: ``$env:CI_COMMIT_SHA```n`n- **Installer (.msix):** double-click to install (Windows 10+)`n- **Portable (.zip):** extract and run ``health_wallet.exe``"
        assets      = @{ links = @(
          @{ name = $msixOut; url = "$packageUrl/$msixOut"; link_type = "package" },
          @{ name = $zip;     url = "$packageUrl/$zip";     link_type = "package" }
        ) }
      } | ConvertTo-Json -Depth 5
      Invoke-RestMethod -Method Post -Uri "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/releases" -Headers $headers -ContentType "application/json" -Body $release
  after_script:
    - Remove-Item -Force -ErrorAction SilentlyContinue .env
