# Formats every file type before it is committed and checks the commit message.
#   Install once per clone:  pre-commit install
#   Format the whole repo:   pre-commit run --all-files
# A hook that reformats a file fails the commit; review the change, `git add` it and commit again.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
minimum_pre_commit_version: "4.0.0"

# Generated, tool-managed (Xcode, Flutter) or data files are never reformatted.
exclude: |
  (?x)^(
    \.github/|\.idea/|_bmad-output/|assets/|drift_schemas/|
    (.*/)?build/|
    test/drift/my_database/generated/|
    lib/core/l10n/arb/app_localizations.*\.dart$|
    windows/flutter/|
    .*/GeneratedPluginRegistrant\.swift$|
    ios/fastlane/report\.xml$|
    .*\.xcassets/|
    LICENSE\.md$|test_sync_data\.json$|untranslated_messages\.json$
  )|\.(g|freezed|gr|config|gen)\.dart$
  |\.(pbxproj|xcscheme|xcworkspacedata|xcsettings|storyboard|xib|plist|entitlements|lock|resolved|msgpack)$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: forbid-secret-files
        name: forbid secret files (see AGENTS.md)
        language: fail
        entry: Secret files must never be committed; they live in GitLab CI/CD variables.
        files: \.(pem|p8|p12|key|jks|keystore)$|service-account|(^|/)\.env$
      - id: dart-format
        name: dart format
        language: system
        entry: fvm dart format
        types: [dart]
      - id: prettier
        name: prettier (YAML, JSON, ARB, Markdown, HTML, CSS, JavaScript, XML)
        language: system
        entry: npx --no-install prettier --write --ignore-unknown
        types: [text]
      - id: swift-format
        name: swift-format
        language: system
        entry: xcrun swift-format format --in-place
        types: [swift]
      - id: commitlint
        name: commitlint (Conventional Commits)
        language: system
        entry: npx --no-install commitlint --edit
        stages: [commit-msg]

  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.16.0
    hooks:
      - id: pretty-format-kotlin
        args: [--autofix, --ktlint-version=1.8.0]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        types_or: [c, c++]

  - repo: https://github.com/BlankSpruce/gersemi-pre-commit
    rev: 0.29.2
    hooks:
      - id: gersemi

  - repo: https://github.com/rubocop/rubocop
    rev: v1.92.0
    hooks:
      - id: rubocop
        args: [--autocorrect]
        types: [text]
        files: (^|/)(Gemfile|Podfile|Fastfile|Appfile)$|\.rb$

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
