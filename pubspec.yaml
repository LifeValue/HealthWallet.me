name: health_wallet
description: "Open-source, patient-controlled health record app with on-device AI. Aggregates medical data from 52K+ providers via FHIR R4. Offline-first."
publish_to: "none"
version: 1.3.0+1

environment:
  sdk: ">=3.13.5 <4.0.0"
  flutter: ">=3.47.7"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.4
  bloc: ^8.1.3

  # Dependency Injection
  get_it: ^8.3.0
  injectable: ^3.0.0

  # Code Generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Routing
  auto_route: ^11.1.0

  # Network
  dio: ^5.9.2
  http: ^1.6.0

  # Local Storage
  drift: ^2.34.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.5
  shared_preferences: ^2.5.4

  # UI
  flutter_svg: ^2.2.4
  vector_graphics: ^1.1.19
  flutter_native_splash: ^2.3.8

  # Desktop
  qr_flutter: ^4.1.0
  bonsoir: ^5.1.0
  pointycastle: ^3.9.1
  tray_manager: ^0.5.2
  window_manager: ^0.4.3

  # Utils
  intl: ^0.20.2
  logger: ^2.0.2+1
  package_info_plus: ^10.2.2
  local_auth: ^2.1.7
  reorderable_grid_view: ^2.2.8
  url_launcher: ^6.2.5
  android_intent_plus: ^5.0.2
  fhir_r4: ^0.6.0
  file_picker: ^13.1.0
  path: ^1.9.1
  share_plus: ^13.3.1
  mobile_scanner: ^7.2.0

  fhir_ips_export:
    git:
      url: ssh://git@git.lifevalue.com:2822/mobile/health-wallet/fhir-ips-export.git
  flutter_doc_scanner: ^0.0.18
  permission_handler: ^12.0.1
  open_file: ^3.5.10
  image_picker: ^1.0.7
  battery_plus: ^7.1.2
  pdfx: ^2.9.2
  pdf: ^3.13.1
  printing: ^5.13.4
  llamadart: ^0.15.6
  image: ^4.0.0
  background_downloader: ^9.5.4
  flutter_pdfview: ^1.4.3
  receive_sharing_intent: ^1.9.0
  string_similarity: ^2.1.1
  phone_numbers_parser: ^9.0.20
  bloc_concurrency: ^0.2.5
  collection: ^1.19.1
  crypto: ^3.0.7
  cryptography: ^2.9.0
  csslib: ^1.0.2
  uuid: ^4.5.3
  envied: ^1.3.5
  app_links: ^7.2.2
  another_flushbar: ^1.12.32
  dotted_border: ^3.1.0
  device_info_plus: ^13.3.0
  desktop_drop: ^0.4.4

  passkit: ^1.1.0
  flutter_google_wallet: ^0.2.1

  airdrop:
    git:
      url: ssh://git@git.lifevalue.com:2822/mobile/flutter/packages/flutter-airdrop.git
      ref: main
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0

  # Extraction benchmark (tool/extraction_bench, integration_test/)
  args: ^2.7.0
  ffi: ^2.2.0

  # Code Generation
  build_runner: ^2.15.0
  freezed: ^4.0.0
  json_serializable: ^6.13.2
  injectable_generator: ^3.1.0
  auto_route_generator: ^10.6.0
  drift_dev: ^2.34.1

  # Testing
  mockito: ^5.6.5
  bloc_test: ^9.1.5
  fake_async: ^1.3.3
  envied_generator: ^1.3.5

  # Windows Packaging
  msix: ^3.16.8

flutter:
  config:
    # receive_sharing_intent 1.9+ ships iOS only as a Swift package. Per-project, so no machine needs
    # a global `flutter config --enable-swift-package-manager`.
    enable-swift-package-manager: true
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - assets/demo_data/
    - assets/images/
    - assets/icons/
    - assets/specialities/
    - assets/onboarding/
    - assets/certs/
    - assets/certs/android/
    - assets/font/matter-font/
    - assets/correction_templates/ro/
    - shorebird.yaml

  fonts:
    - family: Matter
      fonts:
        - asset: assets/font/matter-font/Matter-Regular.ttf
        - asset: assets/font/matter-font/Matter-RegularItalic.ttf
          style: italic
        - asset: assets/font/matter-font/Matter-Light.ttf
          weight: 300
        - asset: assets/font/matter-font/Matter-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/font/matter-font/Matter-Medium.ttf
          weight: 500
        - asset: assets/font/matter-font/Matter-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/font/matter-font/Matter-SemiBold.ttf
          weight: 600
        - asset: assets/font/matter-font/Matter-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/font/matter-font/Matter-Bold.ttf
          weight: 700
        - asset: assets/font/matter-font/Matter-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/font/matter-font/Matter-Heavy.ttf
          weight: 900
        - asset: assets/font/matter-font/Matter-HeavyItalic.ttf
          weight: 900
          style: italic

flutter_gen:
  output: lib/gen
  line_length: 80

  integrations:
    flutter_svg: true

msix_config:
  display_name: HealthWallet.me
  publisher_display_name: Life Value
  identity_name: LifeValue.HealthWallet.me
  publisher: CN=F49BCCE3-FB30-4599-99B7-76CF5193DE76
  logo_path: assets/icons/app-icon.png
  capabilities: internetClient, privateNetworkClientServer
  install_certificate: false
  store: true
dependency_overrides:
  fhir_r4: ^0.6.0
